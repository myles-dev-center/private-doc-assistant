[project]
name = "docassist"
version = "0.1.0"
description = "Private document assistant with citations, structured extraction and an accuracy eval harness"
readme = "README.md"
authors = [
    { name = "Myles", email = "352709503+myles-dev-center@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.31.1",
    "rapidocr>=3.10.0",
]

[project.scripts]
docassist = "docassist.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_corpus.py" = ["E501"]  # contract prose

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
# Pinned so uv.lock stays portable. Use `uv sync --frozen` / `uv run --frozen`
# when a different index is configured, so the lock is not rewritten.
url = "https://pypi.org/simple"
default = true
